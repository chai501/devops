services:
  flask:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - lab-network

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD for the lab}
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      lab-network:
        aliases:
          - mysql

  redis:
    image: redis:7-alpine
    networks:
      lab-network:
        aliases:
          - redis

networks:
  lab-network:
    driver: bridge
