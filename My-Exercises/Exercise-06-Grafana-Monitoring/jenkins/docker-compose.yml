services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exercise6-jenkins
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Set JENKINS_ADMIN_PASSWORD before starting Jenkins}
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
    group_add:
      - "0"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./init.groovy.d:/usr/share/jenkins/ref/init.groovy.d:ro
      - ..:/workspace/exercise:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins-home:/var/jenkins_home
    restart: unless-stopped

volumes:
  jenkins-home:
    external: true
    name: exercise-06-grafana-monitoring_exercise6-jenkins-data
