services:
  delivery-metrics:
    build: .
    container_name: exercise6-delivery-metrics
    environment:
      PENDING_DELIVERIES_MIN: ${PENDING_DELIVERIES_MIN:-10}
      PENDING_DELIVERIES_MAX: ${PENDING_DELIVERIES_MAX:-20}
      DELIVERY_TIME_MIN: ${DELIVERY_TIME_MIN:-15}
      DELIVERY_TIME_MAX: ${DELIVERY_TIME_MAX:-45}
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: exercise6-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - exercise6-prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - delivery-metrics
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: exercise6-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - exercise6-grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  exercise6-prometheus-data:
  exercise6-grafana-data:
